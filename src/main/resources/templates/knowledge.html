<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识库 · Spring AI Flow</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/flow.css}">
  <style>
    /* 知识库卡片网格 */
    .kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .kb-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: box-shadow .15s, transform .15s; position: relative; }
    .kb-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .kb-card .kb-name { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .kb-card .kb-name .kb-ico { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
    .kb-card .kb-desc { font-size: 12.5px; color: var(--text-3); margin: 10px 0 0; min-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .kb-card .kb-stats { display: flex; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--text-2); }
    .kb-card .kb-stats b { font-size: 14px; color: var(--text); }
    .kb-card .kb-del { position: absolute; top: 12px; right: 12px; opacity: 0; transition: opacity .15s; border: none; background: none; color: var(--text-3); cursor: pointer; font-size: 14px; padding: 4px 6px; border-radius: 6px; }
    .kb-card:hover .kb-del { opacity: 1; }
    .kb-card .kb-del:hover { background: var(--bg-soft); color: #ef4444; }
    /* 详情弹层（复用 runs 页弹层风格） */
    .modal-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 6vh 20px; backdrop-filter: blur(2px); }
    .modal-mask.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; width: min(860px, 100%); max-height: 84vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal .m-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; border-radius: 14px 14px 0 0; }
    .modal .m-head h3 { font-size: 15px; }
    .modal .m-head .close { margin-left: auto; cursor: pointer; color: var(--text-3); font-size: 18px; padding: 2px 8px; border-radius: 6px; }
    .modal .m-head .close:hover { background: var(--bg-soft); color: var(--text); }
    .modal .m-body { padding: 18px 20px; }
    .modal .m-sec { font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 14px 0 8px; display: flex; align-items: center; }
    .modal .m-sec .act { margin-left: auto; }
    /* 命中片段 */
    .chunk { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .chunk .c-meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-3); margin-bottom: 6px; }
    .chunk .c-score { color: #6366f1; font-weight: 600; }
    .chunk .c-text { font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-all; color: var(--text-2); max-height: 130px; overflow-y: auto; }
    /* 文档ETL进度条 */
    .doc-progress { display: flex; align-items: center; gap: 7px; min-width: 110px; }
    .doc-progress-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--bg-soft); overflow: hidden; }
    .doc-progress-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #6366f1, #8b5cf6); transition: width .6s ease; }
    .doc-progress-txt { font-size: 11px; color: var(--text-2); width: 36px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('knowledge')}"></div>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('知识库')}"></header>

    <main class="page">
      <div style="display:flex; align-items:center; margin-bottom:14px">
        <div class="text-2" style="font-size:13px">上传业务文档，切分向量化后供「检索增强」节点引用；建议 txt / md / json / csv 等纯文本。</div>
        <button type="button" class="btn btn-primary" id="btnNew" style="margin-left:auto">+ 新建知识库</button>
      </div>
      <div class="kb-grid" id="kbGrid">
        <div class="text-3" style="text-align:center; padding:40px 0; grid-column:1/-1">加载中…</div>
      </div>
    </main>
  </div>
</div>

<!-- 知识库详情弹层 -->
<div class="modal-mask" id="kbModal">
  <div class="modal">
    <div class="m-head">
      <h3 id="mKbName">知识库</h3>
      <span class="close" onclick="closeModal()">✕</span>
    </div>
    <div class="m-body">
      <div class="m-sec">
        文档列表
        <span class="act">
          <button type="button" class="btn btn-ghost" id="btnUpload">⬆ 上传文档</button>
          <input type="file" id="fileInput" accept=".txt,.md,.markdown,.json,.csv,.log,.yml,.yaml,.xml,.html" style="display:none">
        </span>
      </div>
      <table class="table" style="border:1px solid var(--border); border-radius:10px; overflow:hidden">
        <thead>
        <tr>
          <th>文档名</th>
          <th style="width:80px">切片数</th>
          <th style="width:80px">状态</th>
          <th style="width:150px">上传时间</th>
          <th style="width:70px"></th>
        </tr>
        </thead>
        <tbody id="docBody">
        <tr><td colspan="5" class="text-3" style="text-align:center; padding:24px 0">暂无文档</td></tr>
        </tbody>
      </table>

      <div class="m-sec">检索调试</div>
      <div style="display:flex; gap:8px">
        <input class="input" id="searchQuery" placeholder="输入查询内容，验证知识库检索效果" style="flex:1">
        <select class="input" id="searchTopK" style="width:90px">
          <option value="1">Top 1</option>
          <option value="3">Top 3</option>
          <option value="4" selected>Top 4</option>
          <option value="8">Top 8</option>
        </select>
        <button type="button" class="btn btn-primary" id="btnSearch">检索</button>
      </div>
      <div id="searchResult" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<div id="toastWrap"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/knowledge.js}"></script>
</body>
</html>

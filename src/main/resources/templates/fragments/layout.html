<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 防闪烁：在首次渲染前恢复本地保存的主题与侧栏折叠状态 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('sf_theme');
    if (t) document.documentElement.dataset.theme = t;
    if (localStorage.getItem('sf_sidebar_collapsed') === '1' && document.body) {
      document.body.classList.add('sidebar-collapsed');
    }
  } catch (e) { /* localStorage 不可用时忽略 */ }
})();
</script>

<!-- 全局侧栏：active 为导航高亮键 home|flows|knowledge|playground|runs|assistant -->
<aside class="sidebar" th:fragment="sidebar(active)">
  <a class="brand" th:href="@{/}">
    <img class="brand-logo" th:src="@{/favicon.svg}" alt="logo">
    <span class="brand-name">Spring AI Flow<em>业务 × 大模型编排引擎</em></span>
  </a>
  <nav class="nav">
    <span class="nav-group">总览</span>
    <a th:href="@{/dashboard}" th:classappend="${active == 'home'} ? 'active'" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"/></svg><span class="nav-label">工作台</span>
    </a>
    <span class="nav-group">编排</span>
    <a th:href="@{/flows}" th:classappend="${active == 'flows'} ? 'active'" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 6h7a3 3 0 0 1 3 3v6a1 1 0 0 0 1 1h4m0 0-2-2m2 2-2 2M4 18h5"/></svg><span class="nav-label">流程库</span>
    </a>
    <a th:href="@{/knowledge}" th:classappend="${active == 'knowledge'} ? 'active'" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13v-4M9 7h7M9 11h5"/></svg><span class="nav-label">知识库</span>
    </a>
    <a th:href="@{/playground}" th:classappend="${active == 'playground'} ? 'active'" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M5 3v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V3M12 10v5m-4 6h8m-4-6v6"/></svg><span class="nav-label">场景体验</span>
    </a>
    <a th:href="@{/runs}" th:classappend="${active == 'runs'} ? 'active'" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg><span class="nav-label">运行历史</span>
    </a>
    <a th:href="@{/assistant}" th:classappend="${active == 'assistant'} ? 'active'" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.8 4.8 1.9-4.8 1.9L12 16.4l-1.9-4.8-4.8-1.9 4.8-1.9zM18.8 14.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1zM5.2 14.8l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span class="nav-label">AI 助手</span>
    </a>
  </nav>
  <div class="sidebar-foot">
    <div class="mode-pill" id="providerPill" title="AI Provider">provider</div>
    <div class="side-tools">
      <button type="button" class="icon-btn" id="btnTheme" title="切换主题">◐<span class="nav-label">主题</span></button>
      <button type="button" class="icon-btn" id="btnCollapse" title="收起 / 展开菜单">‹</button>
    </div>
  </div>
</aside>

<!-- 页面顶栏：title + 右侧操作插槽 -->
<header class="topbar" th:fragment="topbar(title)">
  <h1 class="topbar-title" th:text="${title}">页面</h1>
  <div class="topbar-actions">
    <a class="btn btn-ghost" th:href="@{/flow-editor}">+ 新建流程</a>
    <a class="btn btn-primary" th:href="@{/playground}">场景体验</a>
  </div>
</header>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运行历史 · Spring AI Flow</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/flow.css}">
  <style>
    /* 运行详情弹层（页面局部样式） */
    .modal-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 6vh 20px; backdrop-filter: blur(2px); }
    .modal-mask.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; width: min(860px, 100%); max-height: 84vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal .m-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; border-radius: 14px 14px 0 0; }
    .modal .m-head h3 { font-size: 15px; }
    .modal .m-head .close { margin-left: auto; cursor: pointer; color: var(--text-3); font-size: 18px; padding: 2px 8px; border-radius: 6px; }
    .modal .m-head .close:hover { background: var(--bg-soft); color: var(--text); }
    .modal .m-body { padding: 18px 20px; }
    .modal .m-sec { font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 14px 0 8px; }
  </style>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('runs')}"></div>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('运行历史')}"></header>

    <main class="page">
      <!-- 统计 -->
      <section class="stat-grid">
        <div class="stat-card"><div class="num" id="stTotal">–</div><div class="lbl">运行总数</div></div>
        <div class="stat-card"><div class="num" id="stRate">–</div><div class="lbl">成功率</div></div>
        <div class="stat-card"><div class="num" id="stCost">–</div><div class="lbl">平均耗时</div></div>
        <div class="stat-card"><div class="num" id="stTokens">–</div><div class="lbl">累计 Tokens</div></div>
        <div class="stat-card"><div class="num" id="stCalls">–</div><div class="lbl">模型调用</div></div>
      </section>

      <!-- 筛选工具栏 -->
      <div class="filter-bar">
        <input id="fRunId" class="input" type="search" placeholder="运行ID（支持模糊）" style="width:220px">
        <input id="fFlow" class="input" type="search" placeholder="流程名称 / ID" style="width:180px">
        <select id="fStatus" class="input" style="width:130px">
          <option value="">全部状态</option>
          <option value="RUNNING">运行中</option>
          <option value="SUCCESS">成功</option>
          <option value="FAILED">失败</option>
          <option value="CANCELLED">已取消</option>
        </select>
        <input id="fStart" class="input" type="date" style="width:150px" title="开始日期">
        <span class="filter-sep">–</span>
        <input id="fEnd" class="input" type="date" style="width:150px" title="结束日期">
        <button id="fReset" class="btn btn-sm">重置</button>
        <span id="runTotal" style="color:var(--text-3); font-size:13px"></span>
      </div>

      <!-- 历史列表 -->
      <div class="card" style="overflow:hidden">
        <table class="table">
          <thead>
          <tr>
            <th style="width:150px">运行ID</th>
            <th>流程</th>
            <th style="width:110px">状态</th>
            <th style="width:110px">节点进度</th>
            <th style="width:90px">耗时</th>
            <th style="width:90px">Tokens</th>
            <th style="width:150px">时间</th>
            <th style="width:80px"></th>
          </tr>
          </thead>
          <tbody id="runsBody">
          <tr><td colspan="8" class="text-3" style="text-align:center; padding:40px 0">加载中…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pager" id="runPager" style="display:none"></div>
    </main>
  </div>
</div>

<!-- 详情弹层 -->
<div class="modal-mask" id="runModal">
  <div class="modal">
    <div class="m-head">
      <h3 id="mTitle">运行详情</h3>
      <span id="mBadge"></span>
      <button type="button" class="btn btn-sm" id="mAskDiagnose" style="display:none" title="把本次运行上下文预填给 AI 助手，协助诊断">🩺 问助手诊断</button>
      <span class="close" onclick="closeModal()">✕</span>
    </div>
    <div class="m-body" id="mBody"></div>
  </div>
</div>

<div id="toastWrap"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/runs.js}"></script>
</body>
</html>
